name: Publicar a producción

# Producción (https://el-producido.netlify.app) se despliega desde la rama
# `produccion`. Este workflow la pone al día con `main`, y SOLO se ejecuta a mano:
#   Actions → Publicar a producción → Run workflow.
#
# 1. "Revisar": compara main con producción y verifica que el CI de main pasó.
#    No necesita aprobación (con "Solo simular" se queda aquí).
# 2. "Publicar": usa el ambiente `produccion` de GitHub, que exige la aprobación
#    de JuanAgudelo17. Hasta que él apruebe, nada se publica.
#
# Netlify además salta el build si no cambió nada de la app
# (netlify/ignorar-build.sh), así que publicar solo documentación no gasta créditos.

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: '¿Por qué publicas ahora? (opcional)'
        required: false
      simular:
        description: 'Solo simular: mostrar qué se publicaría, sin publicar'
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  revisar:
    name: Revisar qué se publicaría
    runs-on: ubuntu-latest
    outputs:
      pendiente: ${{ steps.comparar.outputs.pendiente }}
      sha: ${{ steps.comparar.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Comparar main con producción
        id: comparar
        env:
          MOTIVO: ${{ inputs.motivo }}
        run: |
          git fetch origin produccion
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "## Publicar a producción"
            [ -n "$MOTIVO" ] && echo "> $MOTIVO"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/produccion)" ]; then
            echo "✅ Producción ya está al día con main. Nada que publicar." >> "$GITHUB_STEP_SUMMARY"
            echo "pendiente=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "### Commits que se publicarían"
            git log --format='- `%h` %s (%an)' origin/produccion..HEAD
            echo
            if bash netlify/ignorar-build.sh origin/produccion HEAD > cambios.txt; then
              echo "ℹ️ Solo cambió documentación, pruebas o CI: Netlify **no** desplegará (0 créditos)."
            else
              echo "🚀 Hay cambios en la app: Netlify desplegará producción (~15 créditos)."
              echo '```'
              cat cambios.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pendiente=si" >> "$GITHUB_OUTPUT"

      - name: Verificar que el CI de main pasó
        if: steps.comparar.outputs.pendiente == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.comparar.outputs.sha }}
        run: |
          estado=$(gh run list --workflow ci.yml --branch main --commit "$SHA" --limit 1 \
            --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
          if [ "$estado" != "completed success" ]; then
            echo "❌ El CI del commit \`${SHA:0:7}\` no está en verde (${estado:-sin ejecución}). No se publica." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ inputs.simular }}" = "true" ]; then
            echo "🧪 **Simulación:** no se publicó nada." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏳ Esperando la aprobación de @JuanAgudelo17 para publicar." >> "$GITHUB_STEP_SUMMARY"
          fi

  publicar:
    name: Publicar (requiere aprobación)
    needs: revisar
    if: needs.revisar.outputs.pendiente == 'si' && !inputs.simular
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://el-producido.netlify.app
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Avanzar la rama produccion
        env:
          SHA: ${{ needs.revisar.outputs.sha }}
        run: |
          # Se publica exactamente el commit revisado, aunque main haya avanzado mientras tanto.
          # Solo avance rápido: si alguien escribió directo en `produccion`, falla en vez de pisarlo.
          git push origin "$SHA:refs/heads/produccion"
          echo "🚀 Publicado \`${SHA:0:7}\` en producción. Netlify despliega en 2-3 minutos." >> "$GITHUB_STEP_SUMMARY"
