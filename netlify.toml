[build]
  command   = "npm run build"
  publish   = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Desarrollo local: `npm run dev` levanta Vite y las funciones en http://localhost:8888
[dev]
  command    = "npm run dev --prefix frontend"
  targetPort = 5173
  port       = 8888
  framework  = "#custom"

# API → función Express
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

# SPA: cualquier otra ruta la maneja React
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
